<style>
/* Layout: one-screen pass-the-phone app, single column max 480px; crime-tape stripes as the one bold motif */
:root{
  --ink:#0d1b20;        /* page ground: deep teal ink */
  --ink-2:#14272e;      /* raised panels */
  --ink-3:#1d353e;      /* chips, inputs */
  --line:#2c4a55;
  --paper:#e8efe9;      /* secret card face */
  --paper-ink:#10201f;
  --fg:#e6efec;
  --muted:#8fa9a6;
  --tape:#ffc83d;       /* accent: crime-scene tape */
  --tape-ink:#141414;
  --red:#ff5b5b;        /* impostor */
  --green:#5fd39a;
  --f-display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:16px 28px;display:flex;flex-direction:column;gap:18px}
.tape{height:14px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,var(--tape-ink) 14px 28px);opacity:.95}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(34px,10vw,46px);letter-spacing:.01em}
h1 em{font-style:normal;color:var(--tape)}
h2{font-size:22px}
.muted{color:var(--muted)}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
input[type=text]{flex:1;min-width:0;background:var(--ink-3);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
input[type=text]::placeholder{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:800;font-size:16px;background:var(--ink-3);border:1px solid var(--line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.btn.danger{background:var(--red);color:#1a0b0b;border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-weight:600;max-width:100%}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip button{width:26px;height:26px;border-radius:50%;border:0;background:var(--line);font-size:15px;line-height:1;flex:none}
.empty{color:var(--muted);font-size:14px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:6px;background:var(--ink-3);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 10px;transition:border-color .4s}
.plist li.moved{border-color:var(--tape)}
.plist .pos{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:2.2ch;font-variant-numeric:tabular-nums}
.plist .pname{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .ic{width:36px;height:36px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--ink-2);font-size:17px;font-weight:700;line-height:1}
.plist .ic[disabled]{opacity:.3;cursor:default}
.plist .ic.rm{color:var(--red)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.cat[aria-pressed=true]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--ink-3);font-size:20px;font-weight:700}
.stepper output{font-family:var(--f-mono);font-size:18px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch input:checked{background:var(--tape)}
.switch input:checked::after{transform:translateX(20px);background:var(--tape-ink)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;border:1px solid var(--line);background:transparent;border-radius:9px;padding:8px 6px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.hint-text{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.center{text-align:center;align-items:center}
.progress{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.progress i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.progress i.done{background:var(--tape)}
.progress i.now{background:var(--fg)}
.bigname{font-family:var(--f-display);font-size:clamp(36px,11vw,54px);line-height:1;word-break:break-word;text-wrap:balance;color:var(--tape)}

/* Secret card */
.card{position:relative;width:100%;aspect-ratio:3/3.6;max-height:56vh;border-radius:18px;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.card .face,.card .cover{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center}
.card .cover{background:var(--ink-3);border:2px dashed var(--line);transition:opacity .15s}
.card .cover .fp{width:86px;height:86px;border-radius:50%;border:3px solid var(--tape);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--tape);letter-spacing:.1em;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);opacity:.75}}
.card .face{background:var(--paper);color:var(--paper-ink);opacity:0;transition:opacity .15s}
.card.open .face{opacity:1}
.card.open .cover{opacity:0}
.face .label{color:#4c625f}
.face .word{font-family:var(--f-display);font-size:clamp(30px,9.5vw,44px);line-height:1.05;word-break:break-word;text-wrap:balance}
.face .cat-tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:6px;padding:3px 8px}
.face.imp{background:var(--red);color:#1b0707}
.face.imp .label{color:#4a1414}
.stamp{font-family:var(--f-display);font-size:clamp(26px,8vw,36px);border:4px solid currentColor;border-radius:8px;padding:6px 12px;transform:rotate(-6deg);letter-spacing:.02em}
.face .hint-box{background:rgba(0,0,0,.12);border-radius:10px;padding:10px 16px}
.face .hint-box b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1}
@media (prefers-reduced-motion:reduce){.card .cover .fp{animation:none}}

.timer{font-family:var(--f-mono);font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--red)}
.score-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.score-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--ink-3);border-radius:10px}
.score-list li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-list li b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.reveal-imp{font-family:var(--f-display);font-size:clamp(30px,9vw,42px);color:var(--red);line-height:1.1;word-break:break-word}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;font-weight:700;min-width:0;word-break:break-word}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>

const CATS = Object.keys(WORDS);
const DB = {};
for (const c of CATS) DB[c] = WORDS[c].split("\n").map(l => l.split("|"));
const TOTAL = CATS.reduce((n,c)=>n+DB[c].length,0);

const LS_KEY = "impostor.v1";
function load(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify({players:S.players, settings:S.settings, used:S.used.slice(-3000)})); } catch(e){} }

const saved = load();
const S = {
  players: Array.isArray(saved.players) ? saved.players : [],
  settings: Object.assign({cats:[], impostors:1, hint:true, showCat:true, timer:180}, saved.settings||{}),
  used: Array.isArray(saved.used) ? saved.used : [],
  screen: "setup",
  round: null,
  confirmReveal: false,
  timerLeft: 0, timerRunning: false, timerId: null,
};
S.settings.cats = S.settings.cats.filter(c => CATS.includes(c));

function rnd(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,1800); }
function maxImpostors(){ return Math.max(1, Math.floor((S.players.length-1)/2)); }

function pickWord(){
  const pool = S.settings.cats.length ? S.settings.cats : CATS;
  const usedSet = new Set(S.used);
  let cand = [];
  for (const c of pool) DB[c].forEach((e,i)=>{ const k=c+"#"+i; if(!usedSet.has(k)) cand.push([c,i]); });
  if (!cand.length){ // tudo usado: recomeça a lista desses temas
    S.used = S.used.filter(k => !pool.includes(k.split("#")[0]));
    for (const c of pool) DB[c].forEach((e,i)=>cand.push([c,i]));
  }
  const [c,i] = cand[rnd(cand.length)];
  S.used.push(c+"#"+i);
  return {cat:c, word:DB[c][i][0], hint:DB[c][i][1]};
}

function newRound(){
  const n = S.players.length;
  const k = Math.min(S.settings.impostors, maxImpostors());
  const w = pickWord();
  const imps = shuffle([...Array(n).keys()]).slice(0,k);
  S.round = { ...w, impostors: imps, idx: 0, seen: false, starter: rnd(n), scored: false };
  S.confirmReveal = false;
  stopTimer(); S.timerLeft = S.settings.timer;
  save();
  go("pass");
}

function go(screen){ S.screen = screen; render(); window.scrollTo(0,0); }

/* ---------- Screens ---------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = ({setup:vSetup, pass:vPass, play:vPlay, result:vResult})[S.screen]();
  bind[S.screen] && bind[S.screen]();
}

function vSetup(){
  const n = S.players.length;
  const cats = S.settings.cats;
  const inPool = (cats.length?cats:CATS).reduce((s,c)=>s+DB[c].length,0);
  const hasScores = S.players.some(p=>p.score);
  return `
  <div class="tape" aria-hidden="true"></div>
  <header class="stack">
    <span class="label">Jogo de festa · um celular</span>
    <h1>Quem é o <em>impostor</em>?</h1>
    <p class="muted" style="margin:0">Todo mundo recebe a mesma palavra secreta, menos o impostor, que só ganha uma dica. Conversem, desconfiem e votem.</p>
  </header>

  <section class="panel">
    <div class="spread"><h2>Jogadores</h2><span class="label">${n} ${n===1?"jogador":"jogadores"}</span></div>
    <form class="row" id="addForm" autocomplete="off">
      <input type="text" id="nameInput" placeholder="Nome do jogador" maxlength="24" enterkeyhint="done">
      <button class="btn primary" type="submit">Adicionar</button>
    </form>
    ${n ? `<p class="hint-text" style="margin:0">Coloque na ordem em que vocês estão sentados. A roda segue essa ordem.</p>
    <ol class="plist">
      ${S.players.map((p,i)=>`<li class="${S.moved===i?"moved":""}">
        <span class="pos">${i+1}</span>
        <span class="pname">${esc(p.name)}</span>
        <button type="button" class="ic" data-up="${i}" aria-label="Subir ${esc(p.name)}" ${i===0?"disabled":""}>↑</button>
        <button type="button" class="ic" data-down="${i}" aria-label="Descer ${esc(p.name)}" ${i===n-1?"disabled":""}>↓</button>
        <button type="button" class="ic rm" data-rm="${i}" aria-label="Remover ${esc(p.name)}">×</button>
      </li>`).join("")}
    </ol>` : `<span class="empty">Adicione pelo menos 3 pessoas. Não há limite.</span>`}
    ${n ? `<div class="row" style="flex-wrap:wrap">${n>1?`<button class="btn small ghost" id="shufflePlayers" type="button">Embaralhar ordem</button>`:""}<button class="btn small ghost" id="clearPlayers" type="button">Remover todos</button>${hasScores?`<button class="btn small ghost" id="resetScores" type="button">Zerar placar</button>`:""}</div>`:""}
  </section>

  <section class="panel">
    <div class="spread"><h2>Temas</h2><span class="label">${inPool.toLocaleString("pt-BR")} palavras</span></div>
    <p class="hint-text" style="margin:0">Sem nenhum tema marcado, o sorteio usa todos os ${CATS.length} temas.</p>
    <div class="cats">
      <button type="button" class="cat" data-cat="*" aria-pressed="${!cats.length}">Todos</button>
      ${CATS.map(c=>`<button type="button" class="cat" data-cat="${esc(c)}" aria-pressed="${cats.includes(c)}">${esc(c)}</button>`).join("")}
    </div>
  </section>

  <section class="panel">
    <h2>Regras da rodada</h2>
    <div class="spread">
      <div><div style="font-weight:700">Impostores</div><div class="hint-text">Máx. ${maxImpostors()} com ${Math.max(n,3)} jogadores</div></div>
      <div class="stepper"><button type="button" id="impMinus" aria-label="Menos impostores">−</button><output id="impOut">${Math.min(S.settings.impostors,maxImpostors())}</output><button type="button" id="impPlus" aria-label="Mais impostores">+</button></div>
    </div>
    <label class="switch"><span><span style="font-weight:700;display:block">Dica para o impostor</span><span class="hint-text">Ex.: palavra Sandália, dica Verão</span></span><input type="checkbox" id="optHint" ${S.settings.hint?"checked":""}></label>
    <label class="switch"><span><span style="font-weight:700;display:block">Mostrar o tema</span><span class="hint-text">Todos veem o tema da palavra</span></span><input type="checkbox" id="optCat" ${S.settings.showCat?"checked":""}></label>
    <div class="stack" style="gap:6px">
      <div style="font-weight:700">Tempo de discussão</div>
      <div class="seg" id="segTimer">
        ${[[0,"Livre"],[60,"1 min"],[120,"2 min"],[180,"3 min"],[300,"5 min"]].map(([v,l])=>`<button type="button" data-t="${v}" aria-pressed="${S.settings.timer===v}">${l}</button>`).join("")}
      </div>
    </div>
  </section>

  <button class="btn primary block" id="startBtn" ${n<3?"disabled":""}>${n<3?`Faltam ${3-n} jogador${3-n>1?"es":""}`:"Começar partida"}</button>
  <p class="hint-text center" style="margin:0;text-align:center">${TOTAL.toLocaleString("pt-BR")} palavras em ${CATS.length} temas. Palavras já sorteadas não se repetem.</p>`;
}

function vPass(){
  const R = S.round, p = S.players[R.idx], isImp = R.impostors.includes(R.idx);
  const last = R.idx === S.players.length-1;
  const next = last ? null : S.players[R.idx+1];
  const face = isImp
    ? `<div class="face imp">
         <div class="stamp">IMPOSTOR</div>
         <div style="font-weight:700">Você é o impostor. Não deixe ninguém perceber.</div>
         ${S.settings.hint ? `<div class="hint-box"><span class="label">Sua dica</span><b>${esc(R.hint)}</b></div>` : `<div class="hint-box"><span class="label">Sem dica</span><b>Improvise</b></div>`}
         ${S.settings.showCat ? `<span class="cat-tag">Tema: ${esc(R.cat)}</span>`:""}
       </div>`
    : `<div class="face">
         <span class="label">Palavra secreta</span>
         <div class="word">${esc(R.word)}</div>
         ${S.settings.showCat ? `<span class="cat-tag">Tema: ${esc(R.cat)}</span>`:""}
         <span style="font-size:14px">Você não é o impostor.</span>
       </div>`;
  return `
  <div class="tape" aria-hidden="true"></div>
  <div class="progress" aria-label="Jogador ${R.idx+1} de ${S.players.length}">${S.players.map((_,i)=>`<i class="${i<R.idx?"done":i===R.idx?"now":""}"></i>`).join("")}</div>
  <div class="stack center">
    <span class="label">Entregue o celular para</span>
    <div class="bigname">${esc(p.name)}</div>
    <span class="muted" style="font-size:14px">Só ${esc(p.name)} pode olhar.</span>
  </div>
  <div class="card" id="card" role="button" tabindex="0" aria-label="Segure para ver sua palavra">
    ${face}
    <div class="cover"><div class="fp">SEGURE</div><div style="font-weight:700">Segure o cartão para ver</div><div class="hint-text">Solte para esconder</div></div>
  </div>
  <button class="btn primary block" id="nextBtn" ${R.seen?"":"disabled"}>${last?"Todos viram. Começar!":"Já vi. Passar para "+esc(next.name)}</button>
  <button class="btn ghost small" id="abortBtn" style="align-self:center">Cancelar rodada</button>`;
}

function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }

function vPlay(){
  const R = S.round, st = S.players[R.starter];
  return `
  <div class="tape" aria-hidden="true"></div>
  <div class="stack center">
    <span class="label">Quem começa</span>
    <div class="bigname">${esc(st.name)}</div>
    <p class="muted" style="margin:0">Cada um fala uma palavra ou frase curta sobre a palavra secreta, seguindo a roda a partir de ${esc(st.name)}. Depois discutam e votem em quem parece ser o impostor.</p>
  </div>
  ${S.settings.showCat?`<div class="panel center" style="padding:12px"><span class="label">Tema</span><strong style="font-size:20px">${esc(R.cat)}</strong></div>`:""}
  ${S.settings.timer ? `
  <div class="panel center">
    <div class="timer ${S.timerLeft<=10?"low":""}" id="timer">${fmt(S.timerLeft)}</div>
    <div class="row"><button class="btn small" id="tToggle">${S.timerRunning?"Pausar":(S.timerLeft===S.settings.timer?"Iniciar tempo":"Continuar")}</button><button class="btn small ghost" id="tReset">Reiniciar</button></div>
  </div>`:""}
  <div class="panel stack">
    <span class="label">Ordem da roda</span>
    <div class="players">${S.players.map((_,i)=>S.players[(R.starter+i)%S.players.length]).map((p,i)=>`<span class="pchip" style="padding-right:12px"><span>${i+1}. ${esc(p.name)}</span></span>`).join("")}</div>
  </div>
  <button class="btn ${S.confirmReveal?"danger":"primary"} block" id="revealBtn">${S.confirmReveal?"Toque de novo para revelar":"Votaram? Revelar impostor"}</button>`;
}

function vResult(){
  const R = S.round;
  const imps = R.impostors.map(i=>S.players[i].name);
  const sorted = S.players.map((p,i)=>({...p,i})).sort((a,b)=>(b.score||0)-(a.score||0));
  return `
  <div class="tape" aria-hidden="true"></div>
  <div class="stack center">
    <span class="label">${imps.length>1?"Os impostores eram":"O impostor era"}</span>
    <div class="reveal-imp">${imps.map(esc).join(" e ")}</div>
  </div>
  <dl class="panel kv">
    <dt>Palavra</dt><dd>${esc(R.word)}</dd>
    <dt>Dica</dt><dd>${esc(R.hint)}${S.settings.hint?"":" <span class='muted'>(desligada)</span>"}</dd>
    <dt>Tema</dt><dd>${esc(R.cat)}</dd>
  </dl>
  ${R.scored ? "" : `
  <div class="panel stack">
    <span class="label">Placar da rodada</span>
    <div class="grid2">
      <button class="btn" id="caught">Pegamos o impostor</button>
      <button class="btn" id="escaped">${imps.length>1?"Eles escaparam":"Ele escapou"}</button>
    </div>
    <span class="hint-text">Pegou: +1 para cada inocente. Escapou: +2 para o impostor.</span>
  </div>`}
  ${S.players.some(p=>p.score)?`
  <div class="panel stack">
    <span class="label">Placar geral</span>
    <ul class="score-list">${sorted.map(p=>`<li><span>${esc(p.name)}</span><b>${p.score||0}</b></li>`).join("")}</ul>
  </div>`:""}
  <button class="btn primary block" id="againBtn">Próxima rodada</button>
  <button class="btn block" id="setupBtn">Editar jogadores e temas</button>`;
}

/* ---------- Bindings ---------- */
const bind = {
  setup(){
    const input = document.getElementById("nameInput");
    document.getElementById("addForm").addEventListener("submit", e=>{
      e.preventDefault();
      const names = input.value.split(",").map(s=>s.trim()).filter(Boolean);
      if(!names.length) return;
      for (const name of names){
        if (S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())) { toast(`"${name}" já está na lista`); continue; }
        S.players.push({name, score:0});
      }
      S.moved=null; save(); render(); document.getElementById("nameInput").focus();
    });
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ S.players.splice(+b.dataset.rm,1); S.moved=null; save(); render(); });
    const move=(i,d)=>{ const j=i+d; if(j<0||j>=S.players.length) return; [S.players[i],S.players[j]]=[S.players[j],S.players[i]]; S.moved=j; save(); render(); const f=document.querySelector(`[data-${d<0?"up":"down"}="${j}"]`); if(f&&!f.disabled) f.focus(); };
    document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));
    document.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>move(+b.dataset.down,1));
    const sp=document.getElementById("shufflePlayers");
    if(sp) sp.onclick=()=>{ S.players=shuffle(S.players); S.moved=null; save(); render(); toast("Ordem embaralhada"); };
    const cp = document.getElementById("clearPlayers");
    if (cp) cp.onclick = ()=>{ if(cp.dataset.armed){ S.players=[]; save(); render(); } else { cp.dataset.armed=1; cp.textContent="Toque de novo para confirmar"; } };
    const rs = document.getElementById("resetScores");
    if (rs) rs.onclick = ()=>{ S.players.forEach(p=>p.score=0); save(); render(); toast("Placar zerado"); };
    document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
      const c=b.dataset.cat;
      if(c==="*") S.settings.cats=[];
      else { const s=new Set(S.settings.cats); s.has(c)?s.delete(c):s.add(c); S.settings.cats=[...s]; if(S.settings.cats.length===CATS.length) S.settings.cats=[]; }
      save(); render();
    });
    const setImp = d=>{ S.settings.impostors=Math.max(1,Math.min(maxImpostors(), Math.min(S.settings.impostors,maxImpostors())+d)); save(); render(); };
    document.getElementById("impMinus").onclick=()=>setImp(-1);
    document.getElementById("impPlus").onclick=()=>setImp(1);
    document.getElementById("optHint").onchange=e=>{ S.settings.hint=e.target.checked; save(); };
    document.getElementById("optCat").onchange=e=>{ S.settings.showCat=e.target.checked; save(); };
    document.querySelectorAll("#segTimer [data-t]").forEach(b=>b.onclick=()=>{ S.settings.timer=+b.dataset.t; save(); render(); });
    document.getElementById("startBtn").onclick=()=>{ if(S.players.length>=3) newRound(); };
  },
  pass(){
    const card = document.getElementById("card");
    const nextBtn = document.getElementById("nextBtn");
    const open = e=>{ if(e) e.preventDefault(); card.classList.add("open"); if(!S.round.seen){ S.round.seen=true; nextBtn.disabled=false; } };
    const close = ()=>card.classList.remove("open");
    card.addEventListener("pointerdown", e=>{ open(e); try{card.setPointerCapture(e.pointerId);}catch(_){} });
    card.addEventListener("pointerup", close);
    card.addEventListener("pointercancel", close);
    card.addEventListener("contextmenu", e=>e.preventDefault());
    card.addEventListener("keydown", e=>{ if(e.key===" "||e.key==="Enter") open(e); });
    card.addEventListener("keyup", close);
    nextBtn.onclick=()=>{
      const R=S.round;
      if(R.idx < S.players.length-1){ R.idx++; R.seen=false; render(); }
      else go("play");
    };
    const ab=document.getElementById("abortBtn");
    ab.onclick=()=>{ if(ab.dataset.armed){ go("setup"); } else { ab.dataset.armed=1; ab.textContent="Toque de novo para cancelar"; } };
  },
  play(){
    const tt=document.getElementById("tToggle");
    if(tt) tt.onclick=()=>{ S.timerRunning?stopTimer():startTimer(); render(); };
    const tr=document.getElementById("tReset");
    if(tr) tr.onclick=()=>{ stopTimer(); S.timerLeft=S.settings.timer; render(); };
    document.getElementById("revealBtn").onclick=()=>{
      if(!S.confirmReveal){ S.confirmReveal=true; render(); return; }
      stopTimer(); go("result");
    };
  },
  result(){
    const score = caught=>{
      const R=S.round; if(R.scored) return;
      S.players.forEach((p,i)=>{ const imp=R.impostors.includes(i); if(caught&&!imp) p.score=(p.score||0)+1; if(!caught&&imp) p.score=(p.score||0)+2; });
      R.scored=true; save(); render();
    };
    const c=document.getElementById("caught"), x=document.getElementById("escaped");
    if(c) c.onclick=()=>score(true);
    if(x) x.onclick=()=>score(false);
    document.getElementById("againBtn").onclick=newRound;
    document.getElementById("setupBtn").onclick=()=>go("setup");
  }
};

let wakeLock=null;
async function keepAwake(){ try{ if(navigator.wakeLock && !wakeLock) wakeLock=await navigator.wakeLock.request("screen"); wakeLock&&wakeLock.addEventListener("release",()=>wakeLock=null); }catch(e){} }
function startTimer(){
  if(S.timerLeft<=0) S.timerLeft=S.settings.timer;
  S.timerRunning=true; keepAwake();
  S.timerId=setInterval(()=>{
    S.timerLeft--;
    const el=document.getElementById("timer");
    if(el){ el.textContent=fmt(Math.max(0,S.timerLeft)); el.classList.toggle("low",S.timerLeft<=10); }
    if(S.timerLeft<=0){ stopTimer(); if(navigator.vibrate) try{navigator.vibrate([200,100,200]);}catch(e){} toast("Tempo esgotado. Hora de votar!"); if(S.screen==="play") render(); }
  },1000);
}
function stopTimer(){ clearInterval(S.timerId); S.timerId=null; S.timerRunning=false; }

render();
</script>
